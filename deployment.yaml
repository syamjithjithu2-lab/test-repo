steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Increase Memory Limit
    run: |
      # Simple sed command to double memory limit in a manifest
      sed -i 's/memory: 512Mi/memory: 1024Mi/g' k8s/deployment.yaml

  - name: Create Pull Request
    uses: peter-evans/create-pull-request@v5
    with:
      token: ${{ secrets.GITHUB_TOKEN }}
      commit-message: "chore: increase memory limits due to OOM"
      title: "Automatic Fix: OOM Error Detected"
      body: "This PR was automatically generated because an Out of Memory error was detected in the backend logs."
      branch: auto-fix-oom

  - name: Send Email Notification
    if: success()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: smtp.gmail.com
      server_port: 465
      username: ${{secrets.MAIL_USERNAME}}
      password: ${{secrets.MAIL_PASSWORD}}
      subject: "OOM Fix PR Created"
      body: "A new PR has been created to address OOM errors. View it here: https://github.com/your-repo/pulls"
      to: dev-team@example.com
